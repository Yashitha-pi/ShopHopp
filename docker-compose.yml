# docker-compose.yml
# Local convenience only — brings up backend + frontend together with one
# command. Kubernetes manifests (added in a later phase) will replace this
# for actual cluster deployment.
#
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:8080
#   Backend:  http://localhost:5000

version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key-change-me
      - FRONTEND_ORIGIN=http://localhost:8080
    volumes:
      - backend_data:/app  # keeps shopping.db between restarts

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      - API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  backend_data:
