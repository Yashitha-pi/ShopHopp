<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your cart — Shopfront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">Shopfront<span class="dot">.</span></a>
      <div class="navbar-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
      </div>
      <div class="navbar-right">
        <a class="cart-link" href="cart.html">
          Cart
          <span class="cart-badge" id="cart-count-badge" style="display:none;">0</span>
        </a>
        <div id="navbar-user-slot" style="display:flex; gap:8px;"></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="eyebrow">Cart</div>
      <h2>Your cart</h2>
    </div>

    <div class="cart-layout">
      <div id="cart-list"></div>

      <div class="summary-card">
        <h4>Order summary</h4>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>
        <button class="btn btn-accent btn-block" id="checkout-btn" disabled>Checkout</button>
      </div>
    </div>
  </div>

  <footer class="footer">Shopfront — a demo storefront for testing and learning.</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
