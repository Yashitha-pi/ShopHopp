<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Shopfront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">Shopfront<span class="dot">.</span></a>
      <div class="navbar-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
      </div>
      <div class="navbar-right">
        <a class="cart-link" href="cart.html">
          Cart
          <span class="cart-badge" id="cart-count-badge" style="display:none;">0</span>
        </a>
        <div id="navbar-user-slot" style="display:flex; gap:8px;"></div>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <h2>Welcome back</h2>
    <p class="hint">Log in to see your cart and order history.</p>

    <div class="alert" id="auth-alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-input" type="email" id="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-input" type="password" id="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <p class="form-footer-link">Don't have an account? <a href="register.html">Sign up</a></p>
    <p class="form-footer-link" style="font-size:0.78rem;">Demo admin: admin@shop.com / admin123</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
