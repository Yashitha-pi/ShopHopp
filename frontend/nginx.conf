server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ShopHopp backend — unchanged from before.
    location /api/ {
        proxy_pass http://shopfront-backend-svc:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NEW — IntelliScale predictor service, for the dashboard's
    # GET /dashboard/summary. Note the trailing slash on proxy_pass here
    # (matches the working /api/ block above) so nginx forwards the full
    # path instead of stripping the /dashboard-api/ prefix.
    location /dashboard-api/ {
        proxy_pass http://mlops-predictor-svc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}