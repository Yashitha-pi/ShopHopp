<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Shopfront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">Shopfront<span class="dot">.</span></a>
      <div class="navbar-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
      </div>
      <div class="navbar-right">
        <a class="cart-link" href="cart.html">
          Cart
          <span class="cart-badge" id="cart-count-badge" style="display:none;">0</span>
        </a>
        <div id="navbar-user-slot" style="display:flex; gap:8px;"></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="eyebrow">Catalog</div>
      <h2>All products</h2>
      <p class="subtitle">Search by name, filter by category, or sort by price.</p>
    </div>

    <!-- Admin panel: hidden by default, shown by products.js only for admin users -->
    <div class="admin-panel" id="admin-panel" style="display:none;">
      <h4>Admin — add a product</h4>
      <form id="admin-add-form" class="admin-form-grid">
        <div class="form-group" style="margin:0;">
          <label>Name</label>
          <input class="form-input" id="admin-name" required />
        </div>
        <div class="form-group" style="margin:0;">
          <label>Category</label>
          <input class="form-input" id="admin-category" required />
        </div>
        <div class="form-group" style="margin:0;">
          <label>Price</label>
          <input class="form-input" id="admin-price" type="number" step="0.01" min="0" required />
        </div>
        <div class="form-group" style="margin:0;">
          <label>Quantity</label>
          <input class="form-input" id="admin-quantity" type="number" min="0" required />
        </div>
        <div class="form-group" style="margin:0;">
          <label>Image URL</label>
          <input class="form-input" id="admin-image" placeholder="https://..." />
        </div>
        <div class="form-group" style="margin:0; grid-column: 1 / -1;">
          <label>Description</label>
          <input class="form-input" id="admin-description" />
        </div>
        <button class="btn btn-primary" type="submit">Add product</button>
      </form>

      <h4 style="margin-top:22px;">Manage existing products</h4>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Qty</th><th>Actions</th></tr>
          </thead>
          <tbody id="admin-table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="filter-search" placeholder="Search products by name..." />
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-sort">
        <option value="">Default order</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
      </select>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </div>

  <footer class="footer">Shopfront — a demo storefront for testing and learning.</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
