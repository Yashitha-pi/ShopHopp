# k8s/secret.example.yaml
#
# Do NOT commit a real secret to Git. Instead, create it directly on the
# cluster with:
#
#   kubectl create secret generic shopfront-secrets \
#     --from-literal=secret-key=$(python3 -c "import secrets; print(secrets.token_hex(32))")
#
# This file just documents the shape backend-deployment.yaml expects.

apiVersion: v1
kind: Secret
metadata:
  name: shopfront-secrets
type: Opaque
stringData:
  secret-key: "replace-with-a-real-random-value"
